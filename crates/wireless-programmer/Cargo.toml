[package]
name = "wireless-programmer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Daemon that discovers and programs physical throttle hardware for BigFred"

[[bin]]
name = "wireless-programmer"
path = "src/main.rs"

[dependencies]
wp-proto = { path = "../wp-proto" }
wp-core = { path = "../wp-core" }
wp-link = { path = "../wp-link" }
wp-drivers = { path = "../wp-drivers" }
wp-client = { path = "../wp-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
nix = { version = "0.29", features = ["user", "socket", "fs"] }
libc = "0.2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
