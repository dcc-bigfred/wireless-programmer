[package]
name = "wp-link"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Radio (nl80211/rtnetlink) and bounded HTTP transport for wireless-programmer"

[lib]
name = "wp_link"
path = "src/lib.rs"

[dependencies]
wp-core = { path = "../wp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
log = "0.4"
socket2 = { version = "0.6", default-features = false }

# Radio control via netlink. wl-nl80211 provides NL80211_CMD_CONNECT /
# TRIGGER_SCAN / GET_SCAN with an OpenSystem auth helper; rtnetlink drives
# link state and interface addressing. Both are tokio-integrated.
wl-nl80211 = { version = "0.5", default-features = false, features = ["tokio_socket"] }
rtnetlink = "0.21"
tokio = { version = "1", features = ["net", "time", "io-util", "rt"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
