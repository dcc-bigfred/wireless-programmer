name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    permissions:
      contents: read
    uses: dcc-bigfred/common/.github/workflows/rust-musl-ci.yml@v2
    with:
      binaries: '[{"name":"wireless-programmer","dist":"wireless-programmer-linux"}]'
      build_env: |
        WIRELESS_PROGRAMMER_GIT_COMMIT=${{ github.sha }}

  go:
    name: Go client
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet (go client)
        run: cd go && go vet ./...

      - name: Test (go client)
        run: cd go && go test ./...
